<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>REden</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="masthead">
    <span class="mark-wrap" aria-hidden="true"><span class="mark"></span><span class="bar"></span></span>
    <h1 class="wordmark" aria-label="REden"><b>RE</b>den</h1>
  </header>

  <main>
    <label class="switch">
      <input type="checkbox" role="switch" id="bionic">
      <span class="track" aria-hidden="true"></span>
      <span class="switch-text">Bionic reading</span>
    </label>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <p class="legend"><b class="k2">Ke</b><span class="f">y</span> <b class="k1">wor</b><span class="f">ds</span> <b class="k0">ar</b><span class="f">e</span> bolder. The rest of each word is a little lighter.</p>
    <p id="page" class="page"></p>
  </main>

  <script src="../shared/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
